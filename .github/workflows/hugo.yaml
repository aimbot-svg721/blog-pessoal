name: Build and deploy

on:
  push:
    branches: [main, redesign]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      HUGO_VERSION: 0.164.0
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install Hugo Extended
        run: |
          curl -sfL -o /tmp/hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xf /tmp/hugo.tar.gz -C /usr/local/bin
          hugo version
      - name: Build
        run: hugo --gc --minify
      - name: Verify generated pages
        run: |
          echo "Generated search and tag pages:"
          find public -type f | sort | grep -E '(busca|search|tags|imo)' || true
          for path in public/pt/busca/index.html public/en/search/index.html public/pt/tags/imo/index.html; do
            if [ -f "$path" ]; then echo "FOUND $path"; else echo "MISSING $path"; fi
          done
          test -f public/pt/busca/index.html
          test -f public/en/search/index.html
          test -f public/pt/tags/imo/index.html
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          for path in ("public/pt/busca/index.html", "public/en/search/index.html"):
              html = Path(path).read_text(encoding="utf-8")
              match = re.search(
                  r'<script[^>]*id=search-index[^>]*>(.*?)</script>',
                  html,
                  re.DOTALL,
              )
              assert match, f"Search index missing from {path}"
              entries = json.loads(match.group(1))
              assert entries, f"Search index is empty in {path}"
              assert all("topics" in entry for entry in entries), f"Topics missing in {path}"
              print(f"Validated {path}: {len(entries)} indexed articles")

          portuguese = json.loads(
              re.search(
                  r'<script[^>]*id=search-index[^>]*>(.*?)</script>',
                  Path("public/pt/busca/index.html").read_text(encoding="utf-8"),
                  re.DOTALL,
              ).group(1)
          )
          assert any("IMO" in entry["topics"] for entry in portuguese), "IMO tag missing from Portuguese search index"
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./public

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
