# Requires Hugo >= 0.154.5 (the deployment workflow uses 0.164.0)
baseURL = "https://aimbot-svg721.github.io/blog-pessoal/"
defaultContentLanguage = "pt"
defaultContentLanguageInSubdir = true
disableDefaultSiteRedirect = true
disableKinds = ["taxonomy", "section"]

[taxonomies]
  category = "categories"

[permalinks]
  [permalinks.page]
    posts = "/:slug/"
  [permalinks.term]
    categories = "/:slug/"

[outputs]
  term = ["html"]

[markup.goldmark.extensions.passthrough]
  enable = true
  [markup.goldmark.extensions.passthrough.delimiters]
    block  = [['\[', '\]'], ['$$', '$$']]
    inline = [['\(', '\)'], ['$', '$']]

[markup.tableOfContents]
  startLevel = 2
  endLevel = 2
  ordered = false

[params]
  home_featured = 3
  home_featured_in_list = false

[languages.en]
  title = "Scratch Paper"
  weight = 1
  contentDir = "content/en"
  [languages.en.params]
    hreflang = "en"
    og_locale = "en_US"
    description = "Essays on olympiad math problems: attempts, dead ends, and what I learned thinking out loud."
    nav_categories = [
      { name = "Combinatorics", slug = "combinatorics" },
      { name = "Number Theory", slug = "number-theory" },
      { name = "Algebra", slug = "algebra" },
      { name = "Geometry", slug = "geometry" },
    ]

[languages.pt]
  title = "Papel de Rascunho"
  weight = 2
  contentDir = "content/pt"
  [languages.pt.params]
    hreflang = "pt-BR"
    og_locale = "pt_BR"
    description = "Ensaios sobre problemas de olimpíada de matemática: tentativas, becos sem saída e o que aprendi pensando em voz alta."
    nav_categories = [
      { name = "Combinatória", slug = "combinatoria" },
      { name = "Teoria dos Números", slug = "teoria-dos-numeros" },
      { name = "Álgebra", slug = "algebra" },
      { name = "Geometria", slug = "geometria" },
    ]
