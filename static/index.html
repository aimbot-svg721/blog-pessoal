<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Papel de Rascunho</title>
  <script>
    (function () {
      var lang = 'pt';
      try {
        var saved = localStorage.getItem('lang');
        if (saved === 'pt' || saved === 'en') lang = saved;
      } catch (_) {}
      var projectRoot = new URL('./', window.location.href);
      window.location.replace(new URL(lang + '/', projectRoot).href);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=./pt/">
</head>
<body>
  <p><a href="./pt/">Abrir o blog</a> · <a href="./en/">Open the blog</a></p>
</body>
</html>
