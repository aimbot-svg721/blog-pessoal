{{- /* Context: Pages. Group posts by month, newest first. */ -}}
{{ range (.GroupByDate "2006-01" "desc") }}
  {{ $first := index .Pages 0 }}
  <section class="group">
    <h2 class="group-title">{{ i18n (printf "month_%d" $first.Date.Month) }} {{ $first.Date.Year }}</h2>
    <ul class="items">
      {{ range .Pages.ByDate.Reverse }}{{ partial "item.html" . }}{{ end }}
    </ul>
  </section>
{{ end }}
