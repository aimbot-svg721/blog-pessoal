<li class="card">
  <h3 class="card-title"><a href="{{ .RelPermalink }}">{{ .LinkTitle }}</a></h3>
  {{ with .Description }}<p class="card-desc">{{ . }}</p>{{ end }}
  <p class="card-meta">
    {{ with .GetTerms "categories" }}<span>{{ (index . 0).LinkTitle }}</span>{{ end }}
    <time datetime="{{ .Date.Format "2006-01-02" }}">{{ partial "date.html" .Date }}</time>
  </p>
</li>
